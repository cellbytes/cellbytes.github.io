name: Test, Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The sitemap dates every page from the commit that last touched it,
          # which a shallow checkout cannot answer: it would silently build a
          # sitemap with no lastmod at all.
          fetch-depth: 0
      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          # astro 7 requires node >= 22.12; the action defaults to node 20
          node-version: 22

  test:
    name: Run tests
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Same reason as the build job: the suite checks the dates the build
          # put in the sitemap, so it needs the history they come from.
          fetch-depth: 0
      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      # The sitemap is a build artifact rather than something the dev server
      # serves, so the suite has nothing to read without this. The deploy builds
      # separately, on its own runner.
      - name: Build site
        run: npm run build
      - name: Run Playwright tests
        run: npm run test
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    name: Deploy website
    needs: test
    # Pages refuses a deployment while another is in flight, which fails a run
    # whose build and tests both passed. Queue rather than cancel: every commit
    # on main is a release, so the one already going out still has to land.
    # Scoped to this job so concurrent pushes still build and test in parallel.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
