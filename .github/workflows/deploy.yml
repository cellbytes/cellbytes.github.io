name: Test, Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The sitemap dates every page from the commit that last touched it,
          # which a shallow checkout cannot answer: it would silently build a
          # sitemap with no lastmod at all.
          fetch-depth: 0
      - name: Install, build, and upload your site
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          # Astro 7.4 requires node >= 22.23.4, which a bare `22` does not
          # guarantee; 24 also matches the devcontainer.
          node-version: 24
          # Astro's cached content store is not invalidated by a change to the
          # markdown plugin code (titleFigure), so a cached build could deploy
          # posts rendered by the old plugin, unlike the clean build the test
          # job verified.
          cache: false

  test:
    name: Run tests
    needs: build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reason as the build job: the suite checks the dates the build
          # put in the sitemap, so it needs the history they come from.
          fetch-depth: 0
      - name: Setup node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      # The sitemap is a build artifact rather than something the dev server
      # serves, so the suite has nothing to read without this. The deploy builds
      # separately, on its own runner.
      - name: Build site
        run: npm run build
      - name: Run Playwright tests
        run: npm run test
      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    name: Deploy website
    needs: test
    # Pages refuses a deployment while another is in flight, which fails a run
    # whose build and tests both passed. Queue rather than cancel: every commit
    # on main is a release, so the one already going out still has to land.
    # Scoped to this job so concurrent pushes still build and test in parallel.
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
